    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        
        /* Animação suave para o acordeão */
        .slide-in {
            animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform-origin: top;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Ajustes para os segmentos do gráfico */
        .chart-bar-segment:hover {
            filter: brightness(1.2);
            z-index: 10;
        }

        /* SISTEMA DE TOOLTIPS À PROVA DE FALHAS (Substitui o group-hover do Tailwind) */
        .tip-container {
            position: relative;
        }
        .tip-content {
            opacity: 0;
            visibility: hidden;
            transform: translateY(5px);
            transition: all 0.2s ease-in-out;
            pointer-events: none; /* Impede que o tooltip interfira com os cliques */
            z-index: 100;
        }
        /* Quando o mouse passa pelo container, mostra o conteúdo */
        .tip-container:hover > .tip-content {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            pointer-events: auto;
        }
    </style>
</head>

                            <div class="bg-slate-800 border border-slate-600 text-white text-xs rounded-lg py-1.5 px-3 shadow-xl whitespace-nowrap">
                                <span class="font-bold flex items-center gap-1.5">
                                    <span class="w-2 h-2 rounded-full ${colorClass} inline-block"></span> 
                                    ${seg.n}
                                </span>
                                <div class="text-slate-300 mt-0.5">
                                    <span class="font-bold text-slate-100">${seg.v}%</span> da economia

                                <div class="text-[10px] text-emerald-400 font-medium mt-0.5 border-t border-slate-700 pt-0.5">

                            </div>
                            <div class="w-2 h-2 bg-slate-800 border-b border-r border-slate-600 transform rotate-45 -mt-1"></div>
                        </div>
                    </div>
                `;
            }).join('');

                            <p class="text-sm text-slate-400 leading-relaxed max-w-4xl">

                                <span class="text-xs text-slate-500 mt-2 flex items-center gap-1"><i data-lucide="book-open" class="w-3 h-3"></i> Fontes base: Relatórios IRENA, Redata, ABDC, Serra Verde e dados de mercado de VEs e IA.</span>
                            </p>
                            
                            <div class="bg-slate-900/80 border border-slate-700/50 rounded-lg p-3 inline-flex items-center gap-3 w-fit mt-2 shadow-sm">
                                <div class="bg-blue-500/20 p-1.5 rounded-md">
                                    <i data-lucide="chevron-down" class="text-blue-400 animate-bounce w-4 h-4"></i>
                                </div>
                                <span class="text-xs md:text-sm font-medium text-slate-300"><strong>Guia Interativo:</strong> Toque nos cartões abaixo e <span class="border-b border-dashed border-slate-400 px-1">explore os ícones de informação (<i data-lucide="info" class="w-3 h-3 inline"></i>)</span> para ler as legendas explicativas.</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-6 items-start">
                            ${pillars.map(pillar => {
                                const isExpanded = state.expandedId === pillar.id;
                                
                                let tabContent = '';
                                if (state.activeTab === 'visao') {
                                    tabContent = `
                                        <div class="flex flex-col gap-5">
                                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800/50 relative tip-container">
                                                    <span class="text-[10px] text-slate-500 font-bold uppercase mb-1 border-b border-dashed border-slate-700 cursor-help flex items-center gap-1 w-fit">
                                                        O Sinal Hoje <i data-lucide="info" class="w-3 h-3"></i>
                                                    </span>
                                                    <!-- Legenda Tooltip -->
                                                    <div class="tip-content absolute bottom-full left-0 mb-2 bg-slate-800 border border-slate-600 text-xs text-slate-200 p-2.5 rounded-lg shadow-xl w-52">
                                                        Indicador atual ou métrica-base (Baseline) que comprova a existência de um potencial latente neste setor no Brasil.
                                                    </div>
                                                    <p class="text-slate-300 text-sm font-medium mt-1">${pillar.current}</p>
                                                </div>

                                                <div class="${pillar.bgLight} p-4 rounded-xl border ${pillar.borderLight} relative tip-container">
                                                    <span class="text-[10px] ${pillar.textLight} font-bold uppercase mb-1 border-b border-dashed border-${pillar.color}-700/50 cursor-help flex items-center gap-1 w-fit">
                                                        Projeção 2035 <i data-lucide="info" class="w-3 h-3"></i>
                                                    </span>
                                                    <!-- Legenda Tooltip -->
                                                    <div class="tip-content absolute bottom-full left-0 mb-2 bg-slate-800 border border-slate-600 text-xs text-slate-200 p-2.5 rounded-lg shadow-xl w-56">
                                                        O estado futuro e quantificado almejado pelo Cenário Estratégico, projetando a captura total de valor.
                                                    </div>
                                                    <p class="text-white text-sm font-bold leading-tight mt-1">${pillar.projection}</p>
                                                </div>
                                            </div>

                                            <div>
                                                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                                                    <i data-lucide="trending-up" class="w-3.5 h-3.5"></i> Evidências e Factos
                                                </h4>
                                                <ul class="space-y-2">
                                                    ${pillar.evidences.map(ev => `
                                                        <li class="flex items-start gap-2.5 text-slate-300 text-sm">
                                                            <i data-lucide="chevron-right" class="${pillar.textLight} shrink-0 mt-0.5 w-4 h-4"></i>
                                                            <span class="leading-relaxed">${ev}</span>
                                                        </li>
                                                    `).join('')}
                                                </ul>
                                            </div>

                                            <div class="bg-slate-950 rounded-xl p-4 md:p-5 border border-rose-900/30 flex flex-col sm:flex-row sm:items-start gap-4 mt-2">
                                                <div class="bg-rose-500/10 p-2.5 rounded-full w-fit shrink-0">
                                                    <i data-lucide="shield-alert" class="text-rose-400 w-5 h-5"></i>
                                                </div>
                                                <div class="relative tip-container w-full">
                                                    <h4 class="text-rose-400 font-bold uppercase text-xs tracking-wider mb-1 border-b border-dashed border-rose-800 cursor-help flex items-center gap-1 w-fit">
                                                        Risco Crítico <i data-lucide="info" class="w-3 h-3 text-rose-500"></i>
                                                    </h4>
                                                    <!-- Legenda Tooltip -->
                                                    <div class="tip-content absolute bottom-full left-0 md:left-auto md:right-0 mb-2 bg-slate-800 border border-rose-900 text-xs text-slate-200 p-2.5 rounded-lg shadow-xl w-64">
                                                        O que pode correr mal? O principal estrangulamento de mercado ou político que pode impedir a concretização desta projeção.
                                                    </div>
                                                    <p class="text-slate-300 text-sm leading-relaxed font-medium mt-1">
                                                        ${pillar.risk}
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                } else {
                                    tabContent = `
                                        <div class="flex flex-col gap-6">
                                            <div class="bg-slate-950 p-4 md:p-5 rounded-xl border border-slate-800/50 relative tip-container">
                                                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 border-b border-dashed border-slate-600 cursor-help flex items-center gap-2 w-fit">
                                                    <i data-lucide="activity" class="w-3.5 h-3.5"></i> Leitura de Cenário <i data-lucide="info" class="w-3 h-3"></i>
                                                </h4>
                                                <!-- Legenda Tooltip -->
                                                <div class="tip-content absolute bottom-full left-0 mb-2 bg-slate-800 border border-slate-600 text-xs text-slate-200 p-2.5 rounded-lg shadow-xl w-64">
                                                    Interpretação e síntese qualitativa feita por especialistas em Foresight sobre os dados brutos.
                                                </div>
                                                <p class="text-slate-300 leading-relaxed text-sm">
                                                    ${pillar.analysis}
                                                </p>
                                            </div>

                                            <div>
                                                <h4 class="text-xs font-bold ${pillar.textLight} uppercase tracking-wider mb-3 flex items-center gap-2">
                                                    <i data-lucide="target" class="w-3.5 h-3.5"></i> Direcionamentos de Valor
                                                </h4>
                                                <div class="flex flex-col gap-3">
                                                    ${pillar.insights.map(insight => `
                                                        <div class="${pillar.bgLight} p-4 rounded-xl border ${pillar.borderLight} flex items-start gap-3">
                                                            <i data-lucide="lightbulb" class="${pillar.textLight} shrink-0 mt-0.5 w-[18px] h-[18px]"></i>
                                                            <p class="text-slate-200 text-sm font-medium leading-relaxed">${insight}</p>
                                                        </div>
                                                    `).join('')}
                                                </div>
                                            </div>

                                            <div class="border-t border-slate-800 pt-4">
                                                <h4 class="text-slate-500 font-bold uppercase text-[10px] tracking-wider mb-2 flex items-center gap-1.5">
                                                    <i data-lucide="book-open" class="w-3 h-3"></i> Referências deste vetor
                                                </h4>
                                                <ul class="space-y-1.5">
                                                    ${pillar.sources.map(source => `
                                                        <li class="flex items-start gap-2 text-slate-400 text-xs">
                                                            <div class="mt-1.5 w-1 h-1 rounded-full bg-slate-600 shrink-0"></div>
                                                            <span class="leading-relaxed">${source}</span>
                                                        </li>
                                                    `).join('')}
                                                </ul>
                                            </div>
                                        </div>
                                    `;
                                }

                                return `
                                    <div class="flex flex-col bg-slate-900 rounded-2xl border transition-all duration-300 ${isExpanded ? pillar.borderSolid + ' shadow-[0_4px_30px_rgba(0,0,0,0.3)] z-10' : 'border-slate-800 hover:border-slate-700'}">
                                        <button onclick="toggleExpand('${pillar.id}')" class="w-full text-left p-5 md:p-6 flex flex-col group focus:outline-none relative cursor-pointer">
                                            ${isExpanded ? `<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r ${pillar.gradient} rounded-t-2xl"></div>` : ''}
                                            
                                            <div class="flex items-center justify-between w-full">
                                                <div class="flex flex-col md:flex-row md:items-center gap-4 w-full">
                                                    <div class="p-3 md:p-4 rounded-xl shrink-0 w-fit ${isExpanded ? pillar.bgLight : 'bg-slate-800/80 group-hover:bg-slate-800 transition-colors'}">
                                                        <i data-lucide="${pillar.iconName}" class="${isExpanded ? pillar.textLight : 'text-slate-400'} w-7 h-7"></i>
                                                    </div>
                                                    
                                                    <div class="flex-1">
                                                        <h3 class="text-lg md:text-xl font-bold text-white mb-1 leading-tight">${pillar.title}</h3>
                                                        <div class="flex items-center gap-2 mt-1 md:mt-0 relative tip-container">
                                                            <span class="text-xs text-slate-500 font-bold uppercase tracking-wider border-b border-dashed border-slate-600 cursor-help flex items-center gap-1 hover:text-slate-300 transition-colors">
                                                                Impacto PIB 2035 <i data-lucide="info" class="w-3 h-3 text-slate-400"></i>
                                                            </span>
                                                            <!-- Tooltip Legenda PIB -->
                                                            <div class="tip-content absolute top-full left-0 mt-2 bg-slate-800 border border-slate-600 text-xs text-slate-200 p-2.5 rounded-lg shadow-xl w-56 normal-case font-normal">
                                                                <strong class="text-white block mb-1">Percentagem da Riqueza Nacional</strong>
                                                                Projeção da contribuição estimada (share) deste setor específico para o PIB do Brasil até 2035.
                                                            </div>
                                                            <span class="text-sm font-black ${isExpanded ? pillar.textLight : 'text-slate-300'}">${pillar.gdpShare}</span>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div class="ml-4 p-2 rounded-full border transition-colors shrink-0 ${isExpanded ? 'bg-slate-950 ' + pillar.borderLight : 'border-slate-700 bg-slate-800'}">
                                                    ${isExpanded 
                                                        ? `<i data-lucide="chevron-up" class="${pillar.textLight} w-5 h-5"></i>` 
                                                        : `<i data-lucide="chevron-down" class="text-slate-400 w-5 h-5"></i>`
                                                    }
                                                </div>
                                            </div>
                                        </button>

                                        ${isExpanded ? `
                                            <div class="border-t border-slate-800 bg-slate-950/40 slide-in flex flex-col rounded-b-2xl">
                                                <div class="p-4 bg-slate-900/50 border-b border-slate-800">
                                                    <p class="text-sm text-slate-300 leading-relaxed italic border-l-2 pl-3 border-slate-700">
                                                        ${pillar.intro}
                                                    </p>
                                                </div>

                                                <div class="flex border-b border-slate-800/80 bg-slate-950/80 sticky top-0 z-10">
                                                    <button onclick="setActiveTab('visao')" class="flex-1 py-3 px-2 text-xs md:text-sm font-bold uppercase tracking-wider transition-colors border-b-2 flex items-center justify-center gap-1.5 md:gap-2 ${state.activeTab === 'visao' ? pillar.borderSolid + ' text-white ' + pillar.bgLight : 'border-transparent text-slate-500 hover:text-slate-300'}">
                                                        <i data-lucide="activity" class="w-4 h-4"></i> <span class="hidden sm:inline">Visão Geral</span><span class="sm:hidden">Dados</span>
                                                    </button>
                                                    <button onclick="setActiveTab('estrategia')" class="flex-1 py-3 px-2 text-xs md:text-sm font-bold uppercase tracking-wider transition-colors border-b-2 flex items-center justify-center gap-1.5 md:gap-2 ${state.activeTab === 'estrategia' ? pillar.borderSolid + ' text-white ' + pillar.bgLight : 'border-transparent text-slate-500 hover:text-slate-300'}">
                                                        <i data-lucide="brain-circuit" class="w-4 h-4"></i> <span class="hidden sm:inline">Análise & Insights</span><span class="sm:hidden">Análise</span>
                                                    </button>
                                                </div>

                                                <div class="p-5 md:p-6 space-y-6">
                                                    ${tabContent}
                                                </div>
                                            </div>
                                        ` : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </section>

                    <!-- Seção 4: Roda das Implicações -->
                    <section>
                        <div class="flex flex-col mb-6 space-y-3">
                            <div class="flex items-center gap-2">
                                <i data-lucide="globe" class="text-slate-400"></i>
                                <h2 class="text-xl md:text-2xl font-bold text-white uppercase tracking-wider">Roda das Implicações</h2>
                            </div>
                            <p class="text-sm text-slate-400 leading-relaxed max-w-4xl">
                                <strong class="text-slate-300">O que é isto?</strong> Utilizando o framework de design de futuros conhecido como <i>Futures Wheel</i>, este bloco mapeia o efeito dominó das mudanças sistémicas. Analisamos o que acontece a reboque do Cenário Estratégico, dividindo os impactos em consequências primárias, secundárias e terciárias.<br/>
                                <span class="text-xs text-slate-500 mt-2 flex items-center gap-1"><i data-lucide="book-open" class="w-3 h-3"></i> Fontes base: Exercício de Foresight Estratégico e cruzamento de tendências sociopolíticas.</span>
                            </p>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            ${implications.map((imp, idx) => `
                                <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 md:p-6 relative group hover:border-slate-700 transition-colors flex flex-col">
                                    <div class="absolute -top-3 -left-3 w-8 h-8 bg-slate-800 rounded-full border border-slate-700 flex items-center justify-center font-bold text-slate-400 text-xs md:text-sm">
                                        ${idx + 1}
                                    </div>
                                    <div class="relative tip-container inline-block mb-1 w-fit">
                                        <span class="text-[10px] md:text-xs font-bold text-emerald-500 uppercase tracking-widest border-b border-dashed border-emerald-800/50 cursor-help flex items-center gap-1 hover:text-emerald-400 transition-colors">
                                            ${imp.level} <i data-lucide="info" class="w-3 h-3 text-emerald-600"></i>
                                        </span>
                                        <!-- Legenda Tooltip da Ordem -->
                                        <div class="tip-content absolute bottom-full left-0 mb-2 bg-slate-800 border border-slate-600 text-xs text-slate-200 p-2.5 rounded-lg shadow-xl w-52 normal-case font-normal">
                                            ${imp.level === '1ª Ordem' ? '<strong class="text-white block mb-1">Impacto Imediato</strong>Consequência direta e primária da execução do cenário estratégico.' : imp.level === '2ª Ordem' ? '<strong class="text-white block mb-1">Impacto Secundário</strong>O efeito dominó gerado pelas consequências de 1ª ordem.' : '<strong class="text-white block mb-1">Impacto Estrutural</strong>A mudança profunda (sociológica ou risco sistémico) revelada a longo prazo.'}
                                        </div>
                                    </div>
                                    <h3 class="text-base md:text-lg font-bold text-white mt-1 mb-2">${imp.area}</h3>
                                    <p class="text-slate-400 text-xs md:text-sm leading-relaxed">
                                        ${imp.desc}
                                    </p>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                </main>

                <!-- Footer -->
                <footer class="border-t border-slate-800 bg-slate-950 mt-8 py-6 md:py-8">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="text-center md:text-left">
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Fontes Gerais (Horizon Scanning)</span>
                            <p class="text-xs md:text-sm text-slate-500">IMF WEO 2026 · McKinsey · Goldman Sachs · Serra Verde · Redata · ABDC · IRENA</p>
                        </div>
                        <button class="flex items-center justify-center gap-2 text-xs md:text-sm text-emerald-400 hover:text-emerald-300 transition-colors font-bold bg-emerald-500/10 px-4 py-2 rounded-lg border border-emerald-500/20 w-full md:w-auto">
                            <i data-lucide="external-link" class="w-4 h-4"></i>
                            Metodologia Foresight
                        </button>
                    </div>
                </footer>
            `;

            appRoot.innerHTML = html;
            
            // Re-renderiza os ícones do Lucide sempre que o DOM for atualizado
            lucide.createIcons();
        }

        // Inicializar a aplicação
        renderApp();
    </script>
</body>
</html>
