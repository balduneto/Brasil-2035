    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        
        .slide-in {
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform-origin: top;
        }
        
        .fade-in {
            animation: fadeIn 0.4s ease-in forwards;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .chart-bar-segment:hover {
            filter: brightness(1.2);
            z-index: 10;
        }

        /* SISTEMA DE TOOLTIPS */
        .tip-container {
            position: relative;
        }
        .tip-content {
            opacity: 0;
            visibility: hidden;
            transform: translateY(5px);
            transition: all 0.2s ease-in-out;
            pointer-events: none;
            z-index: 100;
        }
        .tip-container:hover > .tip-content {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            pointer-events: auto;
        }
        
        /* Ajuste do Canvas do Radar */
        #steepleRadarChart {
            filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.1));
        }
    </style>
</head>

                                                </div>

                                                <div class="flex border-b border-slate-800/80 bg-slate-950/80 sticky top-0 z-10">
                                                    <button onclick="setActiveTab('visao')" class="flex-1 py-3 px-2 text-xs md:text-sm font-bold uppercase tracking-wider transition-colors border-b-2 flex items-center justify-center gap-1.5 md:gap-2 ${state.activeTab === 'visao' ? pillar.borderSolid + ' text-white ' + pillar.bgLight : 'border-transparent text-slate-500 hover:text-slate-300'}">
                                                        <i data-lucide="activity" class="w-4 h-4"></i> <span class="hidden sm:inline">Visão Geral</span><span class="sm:hidden">Dados</span>
                                                    </button>
                                                    <button onclick="setActiveTab('estrategia')" class="flex-1 py-3 px-2 text-xs md:text-sm font-bold uppercase tracking-wider transition-colors border-b-2 flex items-center justify-center gap-1.5 md:gap-2 ${state.activeTab === 'estrategia' ? pillar.borderSolid + ' text-white ' + pillar.bgLight : 'border-transparent text-slate-500 hover:text-slate-300'}">
                                                        <i data-lucide="brain-circuit" class="w-4 h-4"></i> <span class="hidden sm:inline">Análise & Insights</span><span class="sm:hidden">Análise</span>

                                                </div>

                                                <div class="p-5 md:p-6 space-y-6">
                                                    ${tabContent}

                                            </div>

                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </section>

                    <!-- Seção 4: Roda das Implicações -->
                    <section>

                                <i data-lucide="globe" class="text-slate-400"></i>

                            </div>
                            <p class="text-sm text-slate-400 leading-relaxed max-w-4xl">
                                <strong class="text-slate-300">O que é isto?</strong> Utilizando o framework de design de futuros conhecido como <i>Futures Wheel</i>, este bloco mapeia o efeito dominó das mudanças sistémicas. Analisamos o que acontece a reboque do Cenário Estratégico, dividindo os impactos em consequências primárias, secundárias e terciárias.<br/>

                                        </span>
                                        <div class="tip-content absolute bottom-full left-0 mb-2 bg-slate-800 border border-slate-600 text-xs text-slate-200 p-2.5 rounded-lg shadow-xl w-52 normal-case font-normal">
                                            ${imp.level === '1ª Ordem' ? '<strong class="text-white block mb-1">Impacto Imediato</strong>Consequência direta e primária da execução do cenário estratégico.' : imp.level === '2ª Ordem' ? '<strong class="text-white block mb-1">Impacto Secundário</strong>O efeito dominó gerado pelas consequências de 1ª ordem.' : '<strong class="text-white block mb-1">Impacto Estrutural</strong>A mudança profunda (sociológica ou risco sistémico) revelada a longo prazo.'}
                                        </div>
                                    </div>
                                    <h3 class="text-base md:text-lg font-bold text-white mt-1 mb-2">${imp.area}</h3>
                                    <p class="text-slate-400 text-xs md:text-sm leading-relaxed">
                                        ${imp.desc}
                                    </p>
                                </div>
                            `).join('')}
                        </div>
                    </section>

                    <!-- Seção 5: Foresight STEEPLE - Conflito EUA x Irã -->
                    <section class="mt-8 border-t border-slate-800/50 pt-10 relative">

                        <div class="flex flex-col mb-8 text-center md:text-left relative z-10">
                            <div class="flex items-center gap-2 justify-center md:justify-start mb-3">
                                <i data-lucide="crosshair" class="text-red-500 w-6 h-6"></i>
                                <h2 class="text-xl md:text-2xl font-bold text-white uppercase tracking-wider">Teste de Estresse: Guerra EUA x Irã</h2>
                            </div>
                            <p class="text-sm text-slate-400 leading-relaxed max-w-4xl mx-auto md:mx-0">
                                <strong class="text-slate-300">Análise STEEPLE:</strong> Como a eclosão de um conflito direto, fechamento do Estreito de Ormuz e ciberguerra afetam a estratégia de cada país em 2035? 
                            </p>
                        </div>

                        <!-- Filtro STEEPLE -->
                        <div class="flex flex-col md:flex-row gap-4 justify-between items-center bg-slate-900/80 p-4 rounded-xl border border-slate-700 shadow-md mb-8 z-10 relative backdrop-blur-sm">

                                <i data-lucide="target" class="w-5 h-5 text-red-400"></i>

                            <select onchange="window.setSteepleCountry(this.value)" class="bg-slate-950 border border-slate-600 text-slate-200 text-sm font-semibold rounded-lg focus:ring-red-500 focus:border-red-500 block w-full md:w-80 p-3 outline-none cursor-pointer hover:bg-slate-800 transition-colors shadow-inner">
                                ${Object.keys(steepleDataByCountry).map(c => `<option value="${c}" ${state.steepleCountry === c ? 'selected' : ''}>${globalChartData.find(g=>g.country === c).flag} ${c}</option>`).join('')}
                            </select>
                        </div>
                        
                        <!-- Painel do Gráfico e Análises STEEPLE -->
                        <div class="grid grid-cols-1 lg:grid-cols-5 gap-6 z-10 relative">
                            <!-- Coluna Esquerda: Gráfico de Radar -->
                            <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-[inset_0_0_40px_rgba(0,0,0,0.5)] flex flex-col items-center">
                                <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4 border-b border-dashed border-slate-700 w-full text-center pb-2">Proporção de Impacto (0-10)</h3>
                                <div class="w-full h-80 relative">
                                    <canvas id="steepleRadarChart"></canvas>
                                </div>
                                <div class="mt-4 text-[10px] text-slate-500 text-center px-4">
                                    *Quanto mais próximo das bordas (10), mais severo ou transformador é o impacto naquela dimensão.
                                </div>
                            </div>

                            <!-- Coluna Direita: Análises Detalhadas dos Eixos -->
                            <div class="lg:col-span-3 flex flex-col gap-3">
                                ${['S', 'T', 'E', 'A', 'P', 'L', 'Et'].map(key => {
                                    const data = currentSteepleData[key];
                                    return `
                                        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-4 flex items-start gap-4 hover:border-emerald-500/30 transition-colors group">
                                            <div class="w-10 h-10 shrink-0 rounded-lg bg-slate-800 flex items-center justify-center border border-slate-700 group-hover:bg-emerald-500/10 group-hover:border-emerald-500/30 transition-all">
                                                <i data-lucide="${data.icon}" class="w-5 h-5 text-slate-400 group-hover:text-emerald-400"></i>
                                            </div>
                                            <div class="flex-1">
                                                <div class="flex justify-between items-center mb-1">
                                                    <h4 class="text-sm font-bold text-white uppercase tracking-wider">${data.title}</h4>
                                                    <span class="text-xs font-black text-emerald-400 bg-emerald-400/10 px-2 py-0.5 rounded border border-emerald-400/20 shadow-sm">${data.score}/10</span>
                                                </div>
                                                <p class="text-xs md:text-sm text-slate-400 leading-relaxed group-hover:text-slate-300 transition-colors">
                                                    ${data.text}
                                                </p>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                    </section>

                                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Fontes Gerais (Horizon Scanning)</span>

                            </div>
                            <button class="flex items-center justify-center gap-2 text-xs md:text-sm text-emerald-400 hover:text-emerald-300 transition-colors font-bold bg-emerald-500/10 px-4 py-2 rounded-lg border border-emerald-500/20 w-full md:w-auto">
                                <i data-lucide="external-link" class="w-4 h-4"></i>
                                Metodologia Foresight
                            </button>
                        </div>

                        <!-- Autoria -->
                        <div class="flex flex-col items-center md:items-start text-center md:text-left gap-4">
                            <span class="text-[10px] md:text-xs font-bold text-emerald-500/80 uppercase tracking-widest flex items-center gap-2">
                                <i data-lucide="pen-tool" class="w-3.5 h-3.5"></i> Autoria & Curadoria Analítica
                            </span>
                            <div class="flex flex-col gap-3 w-full">
                                <div class="bg-slate-900/50 border border-slate-800/80 rounded-xl p-4 md:p-5 flex flex-col md:flex-row gap-4 items-center md:items-start">
                                    <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center shrink-0 border border-slate-700">

                                    </div>
                                    <div>
                                        <h4 class="text-sm font-bold text-slate-200">Marcus Branquinho</h4>
                                        <p class="text-xs text-slate-400 mt-1 leading-relaxed">Executive Sales Leader RJ @ IBM | Automation, AI & Operational Efficiency | Oil & Gas, Utilities & Telecom</p>
                                    </div>
                                </div>
                                <div class="bg-slate-900/50 border border-slate-800/80 rounded-xl p-4 md:p-5 flex flex-col md:flex-row gap-4 items-center md:items-start">
                                    <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center shrink-0 border border-slate-700">
                                        <i data-lucide="user" class="text-slate-400 w-5 h-5"></i>
                                    </div>
                                    <div>
                                        <h4 class="text-sm font-bold text-slate-200">Antonio Balduino Neto</h4>
                                        <p class="text-xs text-slate-400 mt-1 leading-relaxed">Especialista em Foresight Estratégico e Design de Futuros - Diretoria de Educação e Tecnologia - SENAI Goiás</p>
                                    </div>
                                </div>
                            </div>
                            <div class="text-xs text-slate-500 font-mono mt-2 flex items-center gap-2">
                                Análise estratégica · Modelagem de cenários · Maio 2026
                            </div>
                        </div>
                    </div>
                </footer>
            `;

            appRoot.innerHTML = html;
            
            // Re-renderiza os ícones do Lucide
            lucide.createIcons();
            
            // Renderiza o gráfico de radar após injetar o HTML
            renderRadarChart();
        }

        // Inicializar a aplicação
        renderApp();
    </script>
</body>
